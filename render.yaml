services:
  - type: web
    name: storyseed
    runtime: node
    region: singapore
    plan: starter
    rootDir: src/storyseed-project
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/trpc/system.health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eventxp2025
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
